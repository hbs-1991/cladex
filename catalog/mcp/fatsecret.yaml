manifest_version: 1
name: fatsecret
label: FatSecret
description: >
  Nutrition tracking against the FatSecret Platform API.
  Food and recipe lookup, food diary, exercise log and weight history, as four
  action-dispatch tools. The diary tool computes period reports server-side, so
  a week of meals reaches the model as one table rather than thirty rows of JSON.
version: 0.2.0
transport: stdio
command: uvx
args:
  - "--from"
  - "git+https://github.com/hbs-1991/fitmeai@988683ae3d68ffde45af21ad533973674887afc8"
  - "fatsecret-mcp"
scopes: [turn, cron]
env:
  FATSECRET_CONSUMER_KEY: "${FATSECRET_CONSUMER_KEY}"
  FATSECRET_CONSUMER_SECRET: "${FATSECRET_CONSUMER_SECRET}"
  FATSECRET_ACCESS_TOKEN: "${FATSECRET_ACCESS_TOKEN}"
  FATSECRET_ACCESS_SECRET: "${FATSECRET_ACCESS_SECRET}"
auth:
  - name: FATSECRET_CONSUMER_KEY
    prompt: FatSecret Consumer Key from platform.fatsecret.com/api (OAuth 1.0)
  - name: FATSECRET_CONSUMER_SECRET
    prompt: FatSecret Consumer Secret from the same page
  - name: FATSECRET_ACCESS_TOKEN
    prompt: OAuth 1.0 access token (run setup_oauth.py on a machine with a browser)
  - name: FATSECRET_ACCESS_SECRET
    prompt: OAuth 1.0 access token secret (from the same setup_oauth.py run)
