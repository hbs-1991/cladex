manifest_version: 1
name: notion
label: Notion
description: >
  Search, read and update pages and databases in your Notion workspace.
  Notion's hosted MCP server: sign in with your Notion account, and the
  workspace decides what the agent may see.
version: "1"
transport: http
url: https://mcp.notion.com/mcp
scopes: [turn, cron]
auth:
  - name: NOTION_MCP_TOKEN
    kind: oauth
    header: Authorization
    format: "Bearer ${NOTION_MCP_TOKEN}"
