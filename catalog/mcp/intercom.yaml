manifest_version: 1
name: intercom
label: Intercom
description: >
  Conversations, contacts and help-centre articles in Intercom — read support
  threads and search what customers have asked. Intercom's hosted MCP server:
  sign in with your Intercom account.
version: "1"
transport: http
url: https://mcp.intercom.com/mcp
scopes: [turn, cron]
auth:
  - name: INTERCOM_MCP_TOKEN
    kind: oauth
    header: Authorization
    format: "Bearer ${INTERCOM_MCP_TOKEN}"
